version: 2
updates:
  # 每周检查一次 Hexo 依赖更新，避免每天开一堆 PR 打扰
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # 顺便盯着 GitHub Actions 的版本更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
